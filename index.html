<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Big C Work Hub</title>
<style>
  /* ===================== ตั้งค่าลิงก์ปลายทางตรงนี้ ===================== */
  /* แก้ URL ในไฟล์ script ด้านล่างสุด (LINKS object) ได้เลย ไม่ต้องแตะส่วนอื่น */

  html{ color-scheme: light only; }

  :root{
    --bg: #f6f7f9;
    --ink: #14171a;
    --muted: #8a9099;
    --card-radius: 26px;
    --green-solid: #1f9d55;
    --green-tint: #e7f5ec;
    --green-tint2: #d9f0e2;
    --blue-solid: #2f6fed;
    --blue-tint: #eaf1fe;
    --blue-tint2: #dce9fd;
    --violet-solid: #6d4de6;
    --violet-tint: #efecfc;
    --violet-tint2: #e2ddf9;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .screen{
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 34px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo-mark{
    width:46px; height:46px; border-radius:13px;
    background: linear-gradient(155deg, #9ed94f, #6cbf2a);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 8px rgba(90,160,30,0.25);
    flex-shrink:0;
  }
  .logo-mark span{
    color:#d21f1f; font-weight:800; font-size:20px;
    font-style:italic; letter-spacing:-1px;
  }
  .brand-text h1{
    margin:0; font-size:21px; font-weight:800; letter-spacing:-0.3px; line-height:1.1;
    color: var(--ink) !important;
  }
  .brand-text p{
    margin:2px 0 0; font-size:11px; color: var(--muted) !important;
    letter-spacing:2px; font-weight:600;
  }
  .bell{
    width:44px; height:44px; border-radius:50%;
    background:#fff; border:1px solid rgba(0,0,0,0.05);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 6px rgba(20,23,26,0.06);
    position:relative; flex-shrink:0;
  }
  .bell .dot{
    position:absolute; top:9px; right:10px;
    width:7px; height:7px; border-radius:50%;
    background:#e0433a; border:1.5px solid #fff;
  }

  /* ---------- Greeting ---------- */
  .greeting{ text-align:center; margin-bottom: 26px; }
  .greeting h2{
    margin:0 0 6px; font-size:22px; font-weight:800; letter-spacing:-0.3px;
    color: var(--ink) !important;
  }
  .greeting p{ margin:0; font-size:14.5px; color: var(--muted) !important; }

  /* ---------- Cards ---------- */
  .cards{
    display:flex; gap:12px;
    align-items: stretch;
  }
  .card{
    flex:1; min-width:0;
    border-radius: var(--card-radius);
    padding: 18px 12px 20px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    border:none; cursor:pointer; font-family:inherit;
    -webkit-appearance:none; appearance:none;
    position:relative;
    color: var(--ink);
  }
  .card.green{ background: linear-gradient(165deg, var(--green-tint), var(--green-tint2)); }
  .card.blue{ background: linear-gradient(165deg, var(--blue-tint), var(--blue-tint2)); }
  .card.violet{ background: linear-gradient(165deg, var(--violet-tint), var(--violet-tint2)); }

  .badge{
    position:absolute; top:14px; right:14px;
    width:30px; height:30px; border-radius:50%;
    background:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 5px rgba(20,23,26,0.08);
  }
  .badge svg{ width:15px; height:15px; }

  .icon-tile{
    width:64px; height:64px; border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    margin: 6px 0 16px;
    box-shadow: 0 8px 16px -6px rgba(20,23,26,0.28);
  }
  .card.green .icon-tile{ background: linear-gradient(160deg, #35b96a, #178a48); }
  .card.blue .icon-tile{ background: linear-gradient(160deg, #4d8cff, #2058d6); }
  .card.violet .icon-tile{ background: linear-gradient(160deg, #8768f0, #5c3ad6); }
  .icon-tile svg{ width:30px; height:30px; }

  .card h3{
    margin:0 0 6px; font-size:15px; font-weight:800; line-height:1.25;
    min-height: 38px; display:flex; align-items:center;
    color: var(--ink) !important;
  }
  .card p{
    margin:0 0 16px; font-size:11.5px; color:#5b6470 !important; line-height:1.4;
    min-height: 30px;
  }
  .go{
    width:36px; height:36px; border-radius:50%;
    background:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 6px rgba(20,23,26,0.08);
    margin-top:auto;
  }
  .go svg{ width:16px; height:16px; }
  .card.green .go svg{ stroke: var(--green-solid); }
  .card.blue .go svg{ stroke: var(--blue-solid); }
  .card.violet .go svg{ stroke: var(--violet-solid); }
  .card.green .badge svg{ stroke: var(--green-solid); }
  .card.blue .badge svg{ stroke: var(--blue-solid); }
  .card.violet .badge svg{ stroke: var(--violet-solid); }

  .card:active{ transform: scale(0.97); transition: transform .1s ease; }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    margin-top:auto;
    padding-top: 40px;
    display:flex; justify-content:center;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color: var(--green-solid);
  }
  .nav-item span{ font-size:11px; font-weight:600; }
  .nav-item svg{ width:22px; height:22px; }

  /* ---------- Toast for unset links ---------- */
  .toast{
    position:fixed; left:20px; right:20px; bottom:26px;
    background:#14171a; color:#fff; padding:12px 16px; border-radius:14px;
    font-size:13px; text-align:center; opacity:0; pointer-events:none;
    transform: translateY(8px);
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
</style>
</head>
<body>

<div class="screen">

  <div class="header">
    <div class="brand">
      <div class="logo-mark"><span>C</span></div>
      <div class="brand-text">
        <h1>Big C</h1>
        <p>WORK TOGETHER</p>
      </div>
    </div>
    <div class="bell">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14171a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <div class="dot"></div>
    </div>
  </div>

  <div class="greeting">
    <h2>สวัสดีครับ 👋</h2>
    <p>เลือกงานที่คุณต้องการใช้งาน</p>
  </div>

  <div class="cards">

    <button class="card green" data-key="lp">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v2H9z"/><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M8 12h8M8 16h5"/></svg>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      </div>
      <h3>สรุปงาน LP</h3>
      <p>รายงาน Loss Prevention รายวัน</p>
      <div class="go">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </button>

    <button class="card blue" data-key="b2b">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9 13a2 2 0 0 0 4 0"/></svg>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v4h4"/><path d="M9 13h6M9 16h6"/></svg>
      </div>
      <h3>B2B/PJS<br>Sainoi</h3>
      <p>ระบบ B2B / PJS สาขาสายไหม</p>
      <div class="go">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </button>

    <button class="card violet" data-key="incident">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 3v4h-4"/>
        </svg>
      </div>
      <h3>24H Incident<br>Report</h3>
      <p>รายงานเหตุการณ์ 24 ชั่วโมง</p>
      <div class="go">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </button>

  </div>

  <div class="bottom-nav">
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
      <span>หน้าหลัก</span>
    </div>
  </div>

</div>

<div class="toast" id="toast">ยังไม่ได้ตั้งค่าลิงก์นี้</div>

<script>
  // ===================== แก้ลิงก์ปลายทางตรงนี้ =====================
  // ใส่ค่าว่าง "" ไว้ = ยังไม่ตั้งค่า จะขึ้นข้อความเตือนแทนการเปิดหน้าเปล่า
  const LINKS = {
    lp:       "https://dryrh68kkm-beep.github.io/Lp-daily-reports-/",
    b2b:      "https://dryrh68kkm-beep.github.io/B2B-PJS/app.html?v=99",
    incident: "https://dryrh68kkm-beep.github.io/24h-incident-report/"
  };

  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), 1800);
  }

  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const key = card.getAttribute('data-key');
      const url = LINKS[key];
      if(url){
        window.location.href = url;
      } else {
        showToast('ยังไม่ได้ตั้งค่าลิงก์นี้');
      }
    });
  });
</script>

</body>
</html>
