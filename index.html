<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7fbfd">
  <meta name="color-scheme" content="light only">
  <meta name="description" content="ศูนย์รวมระบบงาน LP สาขาไทรน้อย">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LP Work Hub">
  <title>LP Work Hub — สาขาไทรน้อย</title>
  <link rel="manifest" href="site.webmanifest?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=3">
  <style>
    :root{
      color-scheme:light only;
      --page:#f7fbfd;
      --surface:#fff;
      --ink:#142635;
      --muted:#748592;
      --line:#e2edf2;
      --shadow:0 12px 28px rgba(40,105,132,.09);
      --radius:28px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--page)}
    body{
      color:var(--ink);
      font-family:"Noto Sans Thai","Leelawadee UI",Tahoma,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    .shell{
      width:min(100%,1080px);
      min-height:100dvh;
      margin:0 auto;
      padding:max(20px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
    }
    .topbar{display:flex;align-items:center;gap:13px}
    .brand-logo{width:54px;height:54px;flex:0 0 54px;object-fit:contain}
    .brand-name{margin:0;font-size:clamp(21px,5vw,26px);font-weight:850;letter-spacing:-.55px;line-height:1.08}
    .branch{margin:5px 0 0;color:var(--muted);font-size:13px;font-weight:650}
    .intro{margin:30px 0 22px}
    .intro h2{margin:0;font-size:clamp(30px,8.6vw,48px);font-weight:900;letter-spacing:-1.1px;line-height:1.03}
    .intro p{margin:8px 0 0;color:var(--muted);font-size:15px;font-weight:550}
    .apps{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
    }
    .app-card{
      position:relative;
      display:flex;
      min-width:0;
      min-height:138px;
      padding:12px 8px 12px;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.96);
      color:var(--ink);
      text-decoration:none;
      box-shadow:var(--shadow);
      overflow:hidden;
      transition:transform 150ms ease,box-shadow 150ms ease,border-color 150ms ease;
    }
    .app-card::after{
      content:"";
      position:absolute;
      inset:auto -40% -65% -40%;
      height:120px;
      border-radius:50%;
      background:var(--glow,#e9f8ff);
      filter:blur(24px);
      opacity:.7;
      pointer-events:none;
    }
    .app-card.lp{--glow:#dff2ff}
    .app-card.b2b{--glow:#def9f6}
    .app-card.incident{--glow:#e2f1ff}
    .app-card.liquor{--glow:#fff1d9}
    .app-card.expiry{
      --glow:#d7f8df;
      border-color:#bfeacb;
      box-shadow:0 12px 28px rgba(35,185,119,.13);
    }
    .app-icon{
      position:relative;
      z-index:1;
      width:78px;
      height:78px;
      object-fit:contain;
      display:block;
      filter:drop-shadow(0 8px 10px rgba(44,98,126,.08));
      user-select:none;
      -webkit-user-drag:none;
    }
    .app-name{
      position:relative;
      z-index:1;
      margin:0;
      max-width:100%;
      font-size:13px;
      font-weight:850;
      line-height:1.25;
      text-align:center;
      letter-spacing:-.25px;
      overflow-wrap:anywhere;
    }
    .app-card:active{transform:scale(.975)}
    .app-card:focus-visible{outline:3px solid #8dd6ff;outline-offset:3px}
    .helper{margin:18px 0 0;color:#8b9aa4;font-size:12px;text-align:center}
    @media (min-width:760px){
      .shell{padding:32px}
      .intro{margin:54px 0 28px}
      .apps{grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
      .app-card{min-height:220px;padding:22px 14px}
      .app-icon{width:128px;height:128px}
      .app-name{font-size:17px}
      .app-card:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(40,105,132,.14);border-color:#cfe5ee}
    }
    @media (max-height:760px) and (max-width:759px){
      .shell{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
      .brand-logo{width:48px;height:48px;flex-basis:48px}
      .intro{margin:20px 0 16px}
      .intro h2{font-size:30px}
      .apps{gap:8px}
      .app-card{min-height:124px;padding:8px 6px}
      .app-icon{width:68px;height:68px}
      .app-name{font-size:12px}
      .helper{margin-top:12px}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar" aria-label="LP Work Hub">
      <img class="brand-logo" src="assets/lp-logo.png" alt="โลโก้ LP">
      <div>
        <h1 class="brand-name">LP Work Hub</h1>
        <p class="branch">สาขาไทรน้อย</p>
      </div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <h2 id="page-title">พร้อมเริ่มงาน</h2>
      <p>เลือกเครื่องมือที่ต้องการใช้งาน</p>
    </section>

    <nav class="apps" aria-label="ระบบงาน">
      <a class="app-card lp" href="https://dryrh68kkm-beep.github.io/Lp-daily-reports-/" aria-label="เปิดสรุปงาน LP">
        <img class="app-icon" src="assets/icons/lp-summary.svg" alt="">
        <h3 class="app-name">สรุปงาน LP</h3>
      </a>

      <a class="app-card b2b" href="https://dryrh68kkm-beep.github.io/B2B-PJS/app.html?v=99" aria-label="เปิด B2B/PJS Sainoi">
        <img class="app-icon" src="assets/icons/b2b-pjs.svg" alt="">
        <h3 class="app-name">B2B/PJS Sainoi</h3>
      </a>

      <a class="app-card expiry" href="https://expiry-dashboard.dryrh68kkm.workers.dev/mobile.html" aria-label="เปิดสแกนสินค้าหมดอายุ">
        <img class="app-icon" src="assets/icons/expiry-scan.svg" alt="">
        <h3 class="app-name">สแกนสินค้าหมดอายุ</h3>
      </a>

      <a class="app-card incident" href="https://dryrh68kkm-beep.github.io/24h-incident-report/" aria-label="เปิด 24H Incident Report">
        <img class="app-icon" src="assets/icons/incident-24h.svg" alt="">
        <h3 class="app-name">24H Incident Report</h3>
      </a>

      <a class="app-card liquor" href="https://dryrh68kkm-beep.github.io/app/?v=18b82ab" aria-label="เปิดตรวจนับสุรา">
        <img class="app-icon" src="assets/icons/liquor-stock.svg" alt="">
        <h3 class="app-name">ตรวจนับสุรา</h3>
      </a>

    </nav>

    <p class="helper">แตะไอคอนเพื่อเปิดระบบ</p>
  </main>
</body>
</html>
